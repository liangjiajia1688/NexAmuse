<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Member — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button class="mobile-toggle" id="mobileToggle">☰</button>
        <div class="breadcrumb">Members › <span>Add Member</span></div>
      </div>
      <div class="header-right">
        <div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="if(!document.getElementById('userDropdown').classList.contains('open'))this.style.background=''">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div>
      </div>
    </header>
    <div class="admin-content">
      <div class="page-title"><h1>Add New Member</h1><p>Create a new member account manually.</p></div>
      <form onsubmit="submitForm(event)">
        <div class="form-section">
          <h3>Basic Information</h3>
          <div class="form-grid">
            <div class="form-group"><label>First Name *</label><input type="text" placeholder="John" required></div>
            <div class="form-group"><label>Last Name *</label><input type="text" placeholder="Doe" required></div>
            <div class="form-group"><label>Email Address *</label><input type="email" placeholder="john@company.com" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" placeholder="+1 555 0100"></div>
            <div class="form-group"><label>Company Name</label><input type="text" placeholder="Company Inc."></div>
            <div class="form-group"><label>Job Title</label><input type="text" placeholder="Purchasing Manager"></div>
            <div class="form-group"><label>Country *</label>
              <select required>
                <option value="">Select Country</option>
                <option>United States</option><option>United Kingdom</option><option>Germany</option><option>Japan</option><option>Australia</option><option>Singapore</option><option>UAE</option><option>Canada</option><option>France</option><option>Brazil</option>
              </select>
            </div>
            <div class="form-group"><label>City</label><input type="text" placeholder="New York"></div>
          </div>
        </div>
        <div class="form-section">
          <h3>Account Settings</h3>
          <div class="form-grid">
            <div class="form-group"><label>Username *</label><input type="text" placeholder="johndoe" required></div>
            <div class="form-group"><label>Password *</label><input type="password" placeholder="Min 8 characters" required></div>
            <div class="form-group"><label>Member Level</label>
              <select>
                <option>Standard</option><option>Silver</option><option>Gold</option><option>Platinum</option>
              </select>
            </div>
            <div class="form-group"><label>Member Group</label>
              <select>
                <option>Buyers</option><option>Suppliers</option><option>Media</option><option>VIP</option>
              </select>
            </div>
            <div class="form-group"><label>Initial Points</label><input type="number" placeholder="0" min="0"></div>
            <div class="form-group"><label>Status</label>
              <select>
                <option>Active</option><option>Inactive</option><option>Pending Verification</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-section">
          <h3>Notifications</h3>
          <div class="form-grid">
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" style="width:16px;height:16px;accent-color:var(--gold)" checked> Send welcome email
              </label>
            </div>
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" style="width:16px;height:16px;accent-color:var(--gold)" checked> Subscribe to newsletter
              </label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Create Member Account</button>
          <button type="button" class="btn-secondary" onclick="history.back()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
function submitForm(e){
  e.preventDefault();
  alert('✅ Member created successfully!\n(In production: saves to database)');
  location.href='members.html';
}
</script>

<style id="user-dropdown-style">
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;}
.user-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.user-dropdown-info{padding:14px 16px;}
.user-dropdown-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-muted);font-size:13px;text-decoration:none;transition:.15s;cursor:pointer;}
.user-dropdown-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0;}
.user-dropdown-logout{color:#f87171!important;}
.user-dropdown-logout:hover{background:rgba(238,9,121,.08)!important;}
</style>
<script>
function toggleUserMenu(){
  var d=document.getElementById('userDropdown');
  var b=document.getElementById('userMenuBtn');
  if(d.classList.contains('open')){d.classList.remove('open');b.style.background='';}
  else{d.classList.add('open');b.style.background='rgba(255,255,255,.06)';}
}
document.addEventListener('click',function(e){
  var wrap=document.querySelector('.header-user-wrap');
  if(wrap&&!wrap.contains(e.target)){
    var d=document.getElementById('userDropdown');
    var b=document.getElementById('userMenuBtn');
    if(d){d.classList.remove('open');}
    if(b){b.style.background='';}
  }
});
</script>
</body>
</html>
