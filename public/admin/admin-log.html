<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Operation Logs — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
.log-row{display:grid;grid-template-columns:170px 110px 150px 1fr 130px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;transition:background .15s}
.log-row:hover{background:rgba(255,255,255,.02)}
.log-row.header{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.02);border-radius:8px 8px 0 0;border:1px solid var(--border)}
.action-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.a-create{background:rgba(86,171,47,.12);color:#56ab2f}
.a-edit{background:rgba(59,130,246,.12);color:#60a5fa}
.a-delete{background:rgba(248,113,113,.12);color:#f87171}
.a-login{background:rgba(201,162,39,.12);color:var(--gold)}
.a-ban{background:rgba(251,146,60,.12);color:#fb923c}
.log-ip{font-family:monospace;font-size:11px;color:var(--text-muted)}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#e2e8f0;font-size:13px;outline:none}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-card .num{font-size:26px;font-weight:700;color:var(--gold)}
.stat-card .lab{font-size:12px;color:var(--text-muted);margin-top:2px}
.detail-btn{padding:3px 8px;font-size:11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .2s}
.detail-btn:hover{border-color:var(--gold);color:var(--gold)}
.empty-note{text-align:center;padding:40px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left"><button class="mobile-toggle" onclick="toggleSidebar()">☰</button><div class="breadcrumb">Administration / <span>Operation Logs</span></div></div>
      <div class="header-right">
        <div class="user-avatar" id="headerAvatar" onclick="toggleUserMenu()" style="cursor:pointer">A</div>
        <div class="user-dropdown" id="userDropdown" style="display:none;position:absolute;right:20px;top:60px;background:#12182b;border:1px solid var(--border);border-radius:10px;padding:8px;min-width:160px;z-index:999">
          <a href="index.html" style="display:block;padding:8px 12px;color:#e2e8f0;text-decoration:none;border-radius:6px;font-size:13px">🏠 Dashboard</a>
          <hr style="border-color:var(--border);margin:4px 0">
          <a href="#" onclick="adminLogout()" style="display:block;padding:8px 12px;color:#f87171;text-decoration:none;border-radius:6px;font-size:13px">🚪 Sign Out</a>
        </div>
      </div>
    </header>
    <div class="admin-content">
      <div class="stat-row">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lab">Total Log Entries</div></div>
        <div class="stat-card"><div class="num" id="statToday">0</div><div class="lab">Last 24h Actions</div></div>
        <div class="stat-card"><div class="num" style="color:#f87171" id="statDelete">0</div><div class="lab">Delete / Remove Ops</div></div>
        <div class="stat-card"><div class="num" style="color:#fb923c" id="statActors">0</div><div class="lab">Distinct Admins</div></div>
      </div>

      <div class="card" style="margin-bottom:20px;padding:16px 20px">
        <div class="filter-row">
          <select id="actionFilter" onchange="filterLogs()">
            <option value="">All Actions</option>
            <option value="login">Login</option>
            <option value="ad">Ad</option>
            <option value="member">Member</option>
            <option value="forum">Forum</option>
            <option value="admin">Admin</option>
          </select>
          <input type="text" id="adminSearch" placeholder="Search admin / IP / detail..." style="flex:1;min-width:180px" oninput="filterLogs()">
          <button onclick="clearFilters()" style="padding:7px 16px;background:rgba(255,255,255,.05);color:var(--text-muted);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">✕ Clear</button>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-weight:600">Activity Log <span style="font-size:13px;font-weight:400;color:var(--text-muted)" id="logCount"></span></div>
        </div>
        <div class="log-row header"><div>Timestamp</div><div>Action</div><div>Admin</div><div>Details</div><div>IP Address</div></div>
        <div id="logList"><div class="empty-note">Loading…</div></div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
let logs = [];
let filtered = [];

function actionClass(action){
  const a=(action||'').toLowerCase();
  if(a.includes('delete')||a.includes('remove')) return 'a-delete';
  if(a.includes('create')||a.includes('add')) return 'a-create';
  if(a.includes('login')) return 'a-login';
  if(a.includes('ban')||a.includes('suspend')) return 'a-ban';
  if(a.includes('update')||a.includes('edit')) return 'a-edit';
  return 'a-edit';
}
function fmtTs(ts){ if(!ts) return '—'; const d=new Date(ts*1000); return d.toISOString().replace('T',' ').slice(0,19); }

async function loadLogs(){
  try{
    const data = await apiGet('/api/admin/logs?limit=200');
    if(data.ok){
      logs = data.logs||[];
      const s = data.stats||{};
      document.getElementById('statTotal').textContent = s.total||0;
      document.getElementById('statToday').textContent = s.last24||0;
      document.getElementById('statActors').textContent = s.actors||0;
      document.getElementById('statDelete').textContent = (data.breakdown||[]).reduce((n,b)=> (b.action||'').includes('delete')||(b.action||'').includes('remove')? n+b.c : n, 0);
      filterLogs();
    } else { showToast('Failed to load logs'); }
  }catch(e){ showToast('Network error'); }
}

function filterLogs(){
  const act = document.getElementById('actionFilter').value.toLowerCase();
  const q = document.getElementById('adminSearch').value.toLowerCase();
  filtered = logs.filter(l=>{
    if(act && !(l.action||'').toLowerCase().includes(act)) return false;
    if(q){
      const hay = ((l.admin_name||'')+' '+(l.admin_email||'')+' '+(l.ip||'')+' '+(l.detail||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  renderLogs();
}

function clearFilters(){
  document.getElementById('actionFilter').value='';
  document.getElementById('adminSearch').value='';
  filterLogs();
}

function renderLogs(){
  const box=document.getElementById('logList');
  if(!filtered.length){ box.innerHTML='<div class="empty-note">No log entries found</div>'; document.getElementById('logCount').textContent=''; return; }
  document.getElementById('logCount').textContent = `(${filtered.length} entries)`;
  box.innerHTML = filtered.map((l,i)=>`
    <div class="log-row">
      <div style="font-size:12px;color:var(--text-muted);font-family:monospace">${fmtTs(l.created_at)}</div>
      <div><span class="action-badge ${actionClass(l.action)}">${(l.action||'').replace(/_/g,' ')}</span></div>
      <div><div style="font-weight:500">${l.admin_name||'system'}</div><div style="font-size:11px;color:var(--text-muted)">${l.target_type||''}</div></div>
      <div style="font-size:13px;color:var(--text)">${(l.detail||'').length>90?l.detail.slice(0,90)+'…':(l.detail||'')}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="log-ip">${l.ip||'—'}</span>
        <button class="detail-btn" onclick="showDetail(${i})">View</button>
      </div>
    </div>`).join('');
}

function showDetail(idx){
  const l = filtered[idx];
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:#12182b;border:1px solid var(--border);border-radius:14px;padding:28px;max-width:520px;width:90%;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><h3 style="margin:0;font-size:16px">Log Entry Detail</h3><button onclick="this.closest('[style*=fixed]').remove()" style="background:transparent;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">✕</button></div>
    <div style="display:grid;gap:14px">
      <div style="display:flex;gap:8px;align-items:center"><span class="action-badge ${actionClass(l.action)}" style="font-size:13px;padding:5px 14px">${(l.action||'').replace(/_/g,' ')}</span><span style="font-size:12px;color:var(--text-muted)">${l.target_type||''}</span></div>
      <div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.6">${l.detail||''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">
        <div><div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">TIMESTAMP</div><div style="font-family:monospace">${fmtTs(l.created_at)}</div></div>
        <div><div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">IP</div><div style="font-family:monospace">${l.ip||'—'}</div></div>
        <div><div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">ADMIN</div><div style="font-weight:500">${l.admin_name||'system'}</div></div>
        <div><div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">TARGET ID</div><div>${l.target_id||'—'}</div></div>
      </div>
    </div></div>`;
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  document.body.appendChild(modal);
}

document.addEventListener('DOMContentLoaded',loadLogs);
</script>
</body>
</html>
