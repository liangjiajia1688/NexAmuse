<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="breadcrumb">Products › <span>Manage Products</span></div></div>
      <div class="header-right">
        <div class="header-search"><input type="text" placeholder="Search products..."><span>🔍</span></div>
        <div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="if(!document.getElementById('userDropdown').classList.contains('open'))this.style.background=''">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div>
      </div>
    </header>
    <div class="admin-content">
      <div class="page-title"><h1>Manage Products</h1><p>Browse, edit and manage all product listings in the catalog.</p></div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box"><span>🔍</span><input type="text" placeholder="Search products..." id="prodSearch" oninput="filterProds()"></div>
          <select class="filter-select" id="catFilter" onchange="filterProds()">
            <option value="">All Categories</option>
            <option>Arcade Machines</option><option>VR / XR Attractions</option><option>Kids &amp; Family Rides</option>
            <option>Redemption Games</option><option>Simulation Rides</option><option>Outdoor Attractions</option>
            <option>Water Park Equipment</option><option>Payment Technology</option><option>Accessories &amp; Parts</option>
          </select>
          <select class="filter-select" id="statusFilter" onchange="filterProds()">
            <option value="">All Status</option><option>Published</option><option>Draft</option><option>Pending</option>
          </select>
        </div>
        <div class="toolbar-right">
          <button class="btn-primary" onclick="location.href='products-add.html'">+ Add Product</button>
          <button class="btn-secondary">Export</button>
        </div>
      </div>
      <div class="form-section" style="padding:0;overflow:hidden">
        <table class="admin-table" id="productsTable">
          <thead><tr><th><input type="checkbox" class="checkbox-all"></th><th>Product</th><th>Category</th><th>Supplier</th><th>Price Range</th><th>Inquiries</th><th>Views</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="prodsBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="prodPagination"></div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
// Live data: products uploaded by BOTH admins and members (from /api/admin/products)
let products=[],pp=1,perP=20,total=0;
const STATUS_MAP={active:'Published',draft:'Draft',pending:'Pending',pending_review:'Pending'};
const STATUS_KEY={Published:'active',Draft:'draft',Pending:'pending'};

async function loadProds(){
  const token=getToken();
  if(!token){location.href='login.html';return;}
  const qs=new URLSearchParams({page:pp,limit:perP});
  const cf=document.getElementById('catFilter').value;
  const sf=STATUS_KEY[document.getElementById('statusFilter').value]||'';
  const q=document.getElementById('prodSearch').value.trim();
  if(cf)qs.set('cat',cf);
  if(sf)qs.set('status',sf);
  if(q)qs.set('q',q);
  try{
    const r=await fetch('/api/admin/products?'+qs.toString(),{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){adminLogout();return;}
    const data=await r.json();
    if(!data.ok){document.getElementById('prodsBody').innerHTML=`<tr><td colspan="9" style="text-align:center;color:#f87171;padding:24px">${esc(data.error||'Failed to load')}</td></tr>`;return;}
    products=data.products||[];total=data.total||0;
    renderProds();
  }catch(e){
    document.getElementById('prodsBody').innerHTML='<tr><td colspan="9" style="text-align:center;color:#f87171;padding:24px">Network error loading products.</td></tr>';
  }
}

function filterProds(){pp=1;loadProds();}
let searchTimer;
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('prodSearch').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{pp=1;loadProds();},350);});
  loadProds();
});

function priceText(p){
  if(p.price)return p.price;
  if(p.price_type==='fixed'&&p.min_price)return '$'+p.min_price+' USD';
  if(p.min_price&&p.max_price)return '$'+p.min_price+' - $'+p.max_price;
  return 'Price on Request';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderProds(){
  const body=document.getElementById('prodsBody');
  if(!products.length){
    body.innerHTML='<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:32px">No products found. Products added by admins and members will appear here in real time.</td></tr>';
    document.getElementById('prodPagination').innerHTML='';
    return;
  }
  body.innerHTML=products.map(function(p){
    const st=STATUS_MAP[p.status]||p.status;
    const img=p.image
      ?'<img src="'+esc(p.image)+'" style="width:44px;height:44px;object-fit:cover;border-radius:8px;" onerror="this.outerHTML=\'<div style=&quot;font-size:28px;width:44px;text-align:center&quot;>🎮</div>\'">'
      :'<div style="font-size:28px;width:44px;text-align:center">🎮</div>';
    const created=p.created_at?new Date(p.created_at+'Z').toLocaleDateString():'—';
    return '<tr>'
      +'<td><input type="checkbox" class="row-check"></td>'
      +'<td><div class="cell-avatar">'+img+'<div><div style="font-weight:500">'+esc(p.name)+'</div><div style="font-size:11px;color:var(--text-muted)">#PRD-'+(1000+p.id)+' · '+created+(p.featured?' · ⭐':'')+'</div></div></div></td>'
      +'<td><span class="badge">'+esc(p.category||'—')+'</span></td>'
      +'<td style="color:var(--text-muted);font-size:13px">'+esc(p.company_name||'—')+'</td>'
      +'<td style="color:var(--gold)">'+esc(priceText(p))+'</td>'
      +'<td><span style="color:#4facfe">—</span></td>'
      +'<td style="color:var(--text-muted)">—</td>'
      +'<td><span class="tag '+(st==='Published'?'active':st==='Draft'?'closed':'processing')+'">'+esc(st)+'</span></td>'
      +'<td>'
      +'<button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="location.href=\'products-add.html?id='+p.id+'\'">Edit</button> '
      +'<button class="btn-danger" style="padding:4px 10px;font-size:12px;margin-left:4px" onclick="delProd('+p.id+')">Del</button>'
      +'</td>'
      +'</tr>';
  }).join('');
  const pages=Math.max(1,Math.ceil(total/perP));
  let pg='<div style="font-size:12px;color:var(--text-muted);margin-right:10px;align-self:center">'+total+' products total</div>';
  for(let i=1;i<=pages;i++) pg+='<div class="page-btn '+(i===pp?'active':'')+'" onclick="goP('+i+')">'+i+'</div>';
  document.getElementById('prodPagination').innerHTML=pg;
}
function goP(p){pp=p;loadProds();}
async function delProd(id){
  if(!confirm('Delete this product and all its images? This cannot be undone.'))return;
  const token=getToken();
  try{
    const r=await fetch('/api/admin/products?id='+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    const data=await r.json();
    if(!data.ok){alert(data.error||'Delete failed');return;}
    loadProds();
  }catch(e){alert('Network error');}
}
</script>

<style id="user-dropdown-style">
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;}
.user-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.user-dropdown-info{padding:14px 16px;}
.user-dropdown-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-muted);font-size:13px;text-decoration:none;transition:.15s;cursor:pointer;}
.user-dropdown-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0;}
.user-dropdown-logout{color:#f87171!important;}
.user-dropdown-logout:hover{background:rgba(238,9,121,.08)!important;}
</style>
<script>
function toggleUserMenu(){
  var d=document.getElementById('userDropdown');
  var b=document.getElementById('userMenuBtn');
  if(d.classList.contains('open')){d.classList.remove('open');b.style.background='';}
  else{d.classList.add('open');b.style.background='rgba(255,255,255,.06)';}
}
document.addEventListener('click',function(e){
  var wrap=document.querySelector('.header-user-wrap');
  if(wrap&&!wrap.contains(e.target)){
    var d=document.getElementById('userDropdown');
    var b=document.getElementById('userMenuBtn');
    if(d){d.classList.remove('open');}
    if(b){b.style.background='';}
  }
});
</script>
</body>
</html>
