<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAmuse Global — Admin Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:linear-gradient(135deg,#0a0e1a 0%,#0d1b2e 50%,#0a1628 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;position:relative;overflow:hidden}
  body::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
  .particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .particle{position:absolute;width:2px;height:2px;background:#c9a84c;border-radius:50%;opacity:0;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.3}100%{transform:translateY(-10vh) translateX(50px);opacity:0}}
  .login-container{position:relative;z-index:10;width:100%;max-width:440px;padding:20px}
  .logo-area{text-align:center;margin-bottom:36px}
  .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#c9a84c,#f0d080);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 32px rgba(201,168,76,.3)}
  .logo-icon svg{width:36px;height:36px;fill:#0a0e1a}
  .brand-name{font-size:26px;font-weight:700;color:#fff;letter-spacing:1px}
  .brand-sub{font-size:12px;color:#c9a84c;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
  .admin-badge{display:inline-block;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:11px;letter-spacing:2px;padding:4px 14px;border-radius:20px;margin-top:10px;text-transform:uppercase}
  .card{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(201,168,76,.2);border-radius:20px;padding:40px 36px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
  .card h2{font-size:20px;color:#fff;font-weight:600;margin-bottom:8px}
  .card p{font-size:13px;color:#8899aa;margin-bottom:28px}
  .form-group{margin-bottom:20px}
  .form-group label{display:block;font-size:12px;color:#c9a84c;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
  .input-wrap{position:relative}
  .input-wrap input{width:100%;padding:13px 16px 13px 44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:all .3s}
  .input-wrap input:focus{border-color:rgba(201,168,76,.6);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(201,168,76,.1)}
  .input-wrap input::placeholder{color:#556677}
  .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#667788;font-size:16px}
  .input-wrap input[type=password]+.eye-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#667788;cursor:pointer;font-size:16px;background:none;border:none;padding:0}
  .remember-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .remember-row label{display:flex;align-items:center;gap:8px;color:#8899aa;font-size:13px;cursor:pointer}
  .remember-row input[type=checkbox]{width:16px;height:16px;accent-color:#c9a84c}
  .forgot{color:#c9a84c;font-size:13px;text-decoration:none;transition:.2s}
  .forgot:hover{color:#f0d080}
  .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#c9a84c,#a8873a);border:none;border-radius:10px;color:#0a0e1a;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .3s;position:relative;overflow:hidden}
  .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,168,76,.4)}
  .btn-login:active{transform:translateY(0)}
  .btn-login.loading{pointer-events:none;opacity:.8}
  .btn-login .spinner{display:none;width:18px;height:18px;border:2px solid rgba(0,0,0,.2);border-top-color:#0a0e1a;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
  .divider span{flex:1;height:1px;background:rgba(255,255,255,.08)}
  .divider p{font-size:11px;color:#556677;letter-spacing:1px}
  .demo-creds{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:14px;margin-top:8px}
  .demo-creds p{font-size:12px;color:#8899aa;margin:0 0 6px}
  .demo-creds .cred{font-size:12px;color:#c9a84c;font-family:monospace}
  .error-msg{display:none;background:rgba(220,50,50,.1);border:1px solid rgba(220,50,50,.3);color:#ff6b6b;font-size:13px;padding:10px 14px;border-radius:8px;margin-top:-10px;margin-bottom:16px}
  .security-note{display:flex;align-items:center;gap:8px;margin-top:24px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:8px}
  .security-note svg{width:14px;height:14px;fill:#556677;flex-shrink:0}
  .security-note span{font-size:11px;color:#556677}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="login-container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 36 36"><path d="M18 3L33 12v12L18 33 3 24V12L18 3zm0 4.24L7 13.12V22.88L18 28.76 29 22.88V13.12L18 7.24zM18 11a7 7 0 110 14A7 7 0 0118 11zm0 3a4 4 0 100 8 4 4 0 000-8z"/></svg>
    </div>
    <div class="brand-name">NexAmuse Global</div>
    <div class="brand-sub">Premium Amusement Portal</div>
    <div class="admin-badge">🔐 Admin Console</div>
  </div>
  <div class="card">
    <h2>Welcome Back</h2>
    <p>Sign in to manage your portal</p>
    <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="username">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔑</span>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        <button class="eye-toggle" onclick="togglePwd()" title="Show/Hide">👁</button>
      </div>
    </div>
    <div class="remember-row">
      <label><input type="checkbox" id="remember"> Remember me</label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <span id="btnText">Sign In to Admin</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="security-note">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      <span>This is a secured admin area. All activities are logged.</span>
    </div>
  </div>
</div>
<script>
// Floating particles
const pc = document.getElementById('particles');
for(let i=0;i<20;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=(8+Math.random()*12)+'s';
  p.style.animationDelay=(-Math.random()*20)+'s';
  pc.appendChild(p);
}
function togglePwd(){
  const inp=document.getElementById('password');
  inp.type=inp.type==='password'?'text':'password';
}
function doLogin(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  const txt=document.getElementById('btnText');
  const spin=document.getElementById('spinner');
  const err=document.getElementById('errorMsg');
  err.style.display='none';
  txt.style.display='none';
  spin.style.display='block';
  btn.classList.add('loading');
  setTimeout(async ()=>{
    spin.style.display='none';
    txt.style.display='block';
    btn.classList.remove('loading');
    if(u==='dinice'&&p==='dinice123'){
      localStorage.setItem('ng_admin_logged','1');
      localStorage.setItem('ng_admin_user', u);
      // Also obtain a real API token so admin pages/crawlers can call authenticated endpoints.
      try {
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ identifier:'dinice', password:'dinice123' }) });
        if (r.ok) {
          const data = await r.json();
          const u = data.user;
          localStorage.setItem('nexamuse_user', JSON.stringify({
            token: data.token,
            id: u.id,
            name: u.username || u.name || u.email,
            email: u.email,
            username: u.username,
            role: u.role,
            avatar: u.avatar || null,
            loginTime: Date.now()
          }));
        }
      } catch (e) { console.warn('Admin token fetch failed', e); }
      window.location.href='index.html';
    } else {
      err.style.display='block';
    }
  },1200);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
// Auto-redirect if already logged in
if(localStorage.getItem('ng_admin_logged')==='1'){window.location.href='index.html';}
</script>
</body>
</html>
