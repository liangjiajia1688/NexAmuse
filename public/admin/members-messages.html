<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="breadcrumb">Members › <span>Messages</span></div></div>
      <div class="header-right"><div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="if(!document.getElementById('userDropdown').classList.contains('open'))this.style.background=''">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div></div>
    </header>
    <div class="admin-content">
      <div class="page-title"><h1>Messages & Enquiries</h1><p>Manage all user messages and contact form submissions.</p></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn btn-sm active" id="tabInbox" onclick="switchBox('inbox',this)">📥 Inbox <span class="badge" id="inboxCount">0</span></button>
        <button class="btn btn-sm" id="tabUnread" onclick="switchBox('unread',this)">🔴 Unread <span class="badge" id="unreadCount">0</span></button>
        <button class="btn btn-sm" id="tabSent" onclick="switchBox('sent',this)">📤 Sent</button>
      </div>
      <div style="display:grid;grid-template-columns:280px 1fr;gap:20px;height:calc(100vh - 220px)">
        <!-- Message List -->
        <div class="form-section" style="overflow-y:auto;padding:0">
          <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600">Messages</div>
          <div id="msgList">
            <div style="padding:20px 16px;color:var(--text-muted);font-size:13px;text-align:center">Loading…</div>
          </div>
        </div>
        <!-- Message Detail -->
        <div class="form-section" style="display:flex;flex-direction:column">
          <div id="msgDetail">
            <div style="padding:40px 16px;color:var(--text-muted);font-size:13px;text-align:center">Select a message to view.</div>
          </div>
          <div id="replyBox" style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:none">
            <label style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Reply</label>
            <textarea id="replyText" style="width:100%;margin-top:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:13px;min-height:100px;outline:none;font-family:inherit" placeholder="Type your reply..."></textarea>
            <div style="display:flex;gap:10px;margin-top:10px">
              <button class="btn-primary" onclick="sendReply()">Send Reply</button>
              <button class="btn-secondary" onclick="markResolved()">Mark as Resolved</button>
              <button class="btn-danger" style="margin-left:auto" onclick="deleteMsg()">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
let messages = [];
let currentId = null;
let currentBox = 'inbox';

function fmtDate(s){
  if(!s) return '';
  const d = new Date(s.replace(' ', 'T') + (s.includes('Z')?'':'Z'));
  if(isNaN(d)) return s;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function switchBox(box, btn){
  currentBox = box;
  document.querySelectorAll('#tabInbox,#tabUnread,#tabSent').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  await loadMessages(box);
}

async function loadMessages(box){
  try {
    const data = await apiGet('/api/admin/messages?box=' + box);
    if(data && data.ok){ messages = data.messages || []; }
    else { messages = []; }
  } catch(e){ messages = []; }
  if(box === 'inbox'){ const c=document.getElementById('inboxCount'); if(c) c.textContent = messages.length; }
  if(box === 'unread'){ const c=document.getElementById('unreadCount'); if(c) c.textContent = messages.length; }
  renderList();
}

function renderList(){
  const host = document.getElementById('msgList');
  if(!host) return;
  if(!messages.length){ host.innerHTML = '<div style="padding:20px 16px;color:var(--text-muted);font-size:13px;text-align:center">No messages.</div>'; return; }
  host.innerHTML = messages.map(m=>{
    const other = currentBox === 'sent' ? (m.to_name || 'Member') : (m.from_name || 'Member');
    const prefix = currentBox === 'sent' ? 'To: ' : '';
    const unread = (currentBox !== 'sent' && !m.is_read) ? 'style="font-weight:700"' : '';
    const bg = (m.id === currentId) ? 'background:rgba(212,175,55,.06)' : '';
    const dot = (currentBox !== 'sent' && !m.is_read) ? '<span style="color:#f59e0b;font-size:10px">●</span> ' : '';
    return `<div class="msg-row" onclick="selectMsg(${m.id})" style="padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;${bg}">
      <div style="font-size:13px;font-weight:500">${dot}${prefix}${escapeHtml(other)}</div>
      <div style="font-size:12px;color:${m.is_read||currentBox==='sent'?'var(--text-muted)':'var(--gold)'};margin:2px 0">${escapeHtml(m.subject || '(no subject)')}</div>
      <div style="font-size:11px;color:var(--text-muted)">${fmtDate(m.created_at)}</div>
    </div>`;
  }).join('');
}

async function selectMsg(id){
  const m = messages.find(x=>x.id===id);
  if(!m) return;
  currentId = id;
  renderList();
  if(currentBox !== 'sent' && !m.is_read){
    await apiSend('/api/admin/messages?id='+id, 'PUT', {});
    m.is_read = 1;
    if(currentBox === 'unread') loadMessages('unread');
  }
  renderDetail(m);
}

function renderDetail(m){
  const host = document.getElementById('msgDetail');
  const fromTo = currentBox === 'sent'
    ? 'To: ' + escapeHtml(m.to_name || 'Member')
    : 'From: ' + escapeHtml(m.from_name || 'Member');
  host.innerHTML = `
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px">${escapeHtml(m.subject || '(no subject)')}</div>
      <div style="font-size:13px;color:var(--text-muted)">${fromTo} · ${fmtDate(m.created_at)}</div>
    </div>
    <div style="font-size:14px;line-height:1.8;color:var(--text-muted);white-space:pre-wrap">${escapeHtml(m.body)}</div>`;
  document.getElementById('replyBox').style.display = 'flex';
  const rt = document.getElementById('replyText'); if(rt) rt.value = '';
}

async function sendReply(){
  if(currentId == null) return;
  const m = messages.find(x=>x.id===currentId);
  const body = document.getElementById('replyText').value.trim();
  if(!body){ showToast('Please type a reply','error'); return; }
  const toId = currentBox === 'sent' ? m.to_id : m.from_id;
  const res = await apiSend('/api/admin/messages','POST',{
    to_id: toId,
    subject: 'Re: ' + (m.subject || ''),
    body: body,
    parent_id: currentId
  });
  if(res && res.ok){ showToast('Reply sent'); document.getElementById('replyText').value=''; loadMessages(currentBox); }
  else { showToast((res && res.error) || 'Failed to send','error'); }
}

async function markResolved(){
  if(currentId == null) return;
  const res = await apiSend('/api/admin/messages?id='+currentId,'PUT',{});
  if(res && res.ok){ showToast('Marked as resolved'); loadMessages(currentBox); }
  else { showToast((res && res.error) || 'Failed','error'); }
}

async function deleteMsg(){
  if(currentId == null) return;
  if(!confirm('Delete this message?')) return;
  const res = await apiSend('/api/admin/messages?id='+currentId,'DELETE');
  if(res && res.ok){
    showToast('Message deleted');
    currentId = null;
    document.getElementById('msgDetail').innerHTML = '<div style="padding:40px 16px;color:var(--text-muted);font-size:13px;text-align:center">Select a message to view.</div>';
    document.getElementById('replyBox').style.display = 'none';
    loadMessages(currentBox);
  } else { showToast((res && res.error) || 'Failed to delete','error'); }
}

document.addEventListener('DOMContentLoaded', ()=> loadMessages('inbox'));
</script>

<style id="user-dropdown-style">
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;}
.user-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.user-dropdown-info{padding:14px 16px;}
.user-dropdown-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-muted);font-size:13px;text-decoration:none;transition:.15s;cursor:pointer;}
.user-dropdown-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0;}
.user-dropdown-logout{color:#f87171!important;}
.user-dropdown-logout:hover{background:rgba(238,9,121,.08)!important;}
</style>
<script>
function toggleUserMenu(){
  var d=document.getElementById('userDropdown');
  var b=document.getElementById('userMenuBtn');
  if(d.classList.contains('open')){d.classList.remove('open');b.style.background='';}
  else{d.classList.add('open');b.style.background='rgba(255,255,255,.06)';}
}
document.addEventListener('click',function(e){
  var wrap=document.querySelector('.header-user-wrap');
  if(wrap&&!wrap.contains(e.target)){
    var d=document.getElementById('userDropdown');
    var b=document.getElementById('userMenuBtn');
    if(d){d.classList.remove('open');}
    if(b){b.style.background='';}
  }
});
</script>
</body>
</html>
