<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Members — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🎮</span>
      <div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button class="mobile-toggle" id="mobileToggle">☰</button>
        <div class="breadcrumb">Members › <span>Manage Members</span></div>
      </div>
      <div class="header-right">
        <div class="header-search"><input type="text" placeholder="Search members..."><span>🔍</span></div>
        <div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="if(!document.getElementById('userDropdown').classList.contains('open'))this.style.background=''">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div>
      </div>
    </header>
    <div class="admin-content">
      <div class="page-title"><h1>Manage Members</h1><p>View and manage all registered members on the platform.</p></div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box"><span>🔍</span><input type="text" placeholder="Search by name, email or company..." id="searchInput" oninput="filterMembers()"></div>
          <select class="filter-select" id="levelFilter" onchange="filterMembers()">
            <option value="">All Levels</option>
            <option>Platinum</option><option>Gold</option><option>Silver</option><option>Standard</option>
          </select>
          <select class="filter-select" id="statusFilter" onchange="filterMembers()">
            <option value="">All Status</option>
            <option>Active</option><option>Inactive</option>
          </select>
        </div>
        <div class="toolbar-right">
          <button class="btn-primary" onclick="location.href='members-add.html'">+ Add Member</button>
          <button class="btn-secondary">Export CSV</button>
        </div>
      </div>
      <div class="form-section" style="padding:0;overflow:hidden">
        <table class="admin-table" id="membersTable">
          <thead>
            <tr>
              <th><input type="checkbox" class="checkbox-all" onchange="toggleAll(this)"></th>
              <th>Member</th><th>Email</th><th>Company</th><th>Country</th><th>Level</th><th>Points</th><th>Joined</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="membersBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
const members = [
  {id:1,name:'James Lawson',email:'j.lawson@globalfun.com',company:'Global Fun Ltd.',country:'🇺🇸 USA',level:'Gold',points:4820,joined:'2026-01-15',status:'Active'},
  {id:2,name:'Sofia Kramer',email:'sofia@amusement-gmbh.de',company:'Amusement GmbH',country:'🇩🇪 Germany',level:'Silver',points:1230,joined:'2026-01-20',status:'Active'},
  {id:3,name:'Takeshi Noda',email:'t.noda@playworld.jp',company:'Play World Co.',country:'🇯🇵 Japan',level:'Platinum',points:9870,joined:'2025-09-10',status:'Active'},
  {id:4,name:'Ahmed Mansour',email:'ahmed@funzone.ae',company:'FunZone AE',country:'🇦🇪 UAE',level:'Gold',points:3340,joined:'2025-11-05',status:'Active'},
  {id:5,name:'Laura Chen',email:'laura@arcadesg.com',company:'Arcade Masters SG',country:'🇸🇬 Singapore',level:'Gold',points:5100,joined:'2025-10-22',status:'Active'},
  {id:6,name:'Carlos Silva',email:'carlos@entertain.br',company:'Entertainment BR',country:'🇧🇷 Brazil',level:'Standard',points:320,joined:'2026-02-14',status:'Inactive'},
  {id:7,name:'Emma Wilson',email:'emma@funpark.uk',company:'FunPark UK',country:'🇬🇧 UK',level:'Silver',points:1850,joined:'2026-01-03',status:'Active'},
  {id:8,name:'Ravi Patel',email:'ravi@games.in',company:'GameZone India',country:'🇮🇳 India',level:'Standard',points:560,joined:'2026-03-01',status:'Active'},
];
let page=1,perPage=6;
function levelClass(l){return l==='Platinum'?'level-platinum':l==='Gold'?'level-gold':l==='Silver'?'level-silver':'level-standard';}
function filterMembers(){page=1;renderTable();}
function renderTable(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const lf=document.getElementById('levelFilter').value;
  const sf=document.getElementById('statusFilter').value;
  let data=members.filter(m=>{
    const match=!q||(m.name+m.email+m.company).toLowerCase().includes(q);
    const lmatch=!lf||m.level===lf;
    const smatch=!sf||m.status===sf;
    return match&&lmatch&&smatch;
  });
  const total=data.length,pages=Math.ceil(total/perPage);
  const slice=data.slice((page-1)*perPage,page*perPage);
  document.getElementById('membersBody').innerHTML=slice.map(m=>`
    <tr>
      <td><input type="checkbox" class="row-check"></td>
      <td><div class="cell-avatar"><div class="av" style="background:${['#667eea','#d4af37','#11998e','#ee0979','#4facfe'][m.id%5]}">${m.name.split(' ').map(x=>x[0]).join('')}</div><div><div>${m.name}</div><div style="font-size:11px;color:var(--text-muted)">#${1000+m.id}</div></div></div></td>
      <td style="color:var(--text-muted)">${m.email}</td>
      <td>${m.company}</td>
      <td>${m.country}</td>
      <td><span class="level-badge ${levelClass(m.level)}">${m.level}</span></td>
      <td style="color:var(--gold)">${m.points.toLocaleString()}</td>
      <td style="color:var(--text-muted)">${m.joined}</td>
      <td><span class="tag ${m.status==='Active'?'active':'inactive'}">${m.status}</span></td>
      <td>
        <button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="editMember(${m.id})">Edit</button>
        <button class="btn-danger" style="padding:4px 10px;font-size:12px;margin-left:4px" onclick="deleteMember(${m.id})">Del</button>
      </td>
    </tr>`).join('');
  // Pagination
  let pg='';
  for(let i=1;i<=pages;i++) pg+=`<div class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</div>`;
  document.getElementById('pagination').innerHTML=`<div class="page-btn" onclick="goPage(${Math.max(1,page-1)})">‹</div>${pg}<div class="page-btn" onclick="goPage(${Math.min(pages,page+1)})">›</div>`;
}
function goPage(p){page=p;renderTable();}
function toggleAll(cb){document.querySelectorAll('.row-check').forEach(c=>c.checked=cb.checked);}
function editMember(id){alert('Edit member #'+id+'\n(In production: opens edit modal or page)');}
function deleteMember(id){if(confirm('Delete member #'+id+'?'))alert('Deleted (demo mode)');}
renderTable();
</script>

<style id="user-dropdown-style">
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;}
.user-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.user-dropdown-info{padding:14px 16px;}
.user-dropdown-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-muted);font-size:13px;text-decoration:none;transition:.15s;cursor:pointer;}
.user-dropdown-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0;}
.user-dropdown-logout{color:#f87171!important;}
.user-dropdown-logout:hover{background:rgba(238,9,121,.08)!important;}
</style>
<script>
function toggleUserMenu(){
  var d=document.getElementById('userDropdown');
  var b=document.getElementById('userMenuBtn');
  if(d.classList.contains('open')){d.classList.remove('open');b.style.background='';}
  else{d.classList.add('open');b.style.background='rgba(255,255,255,.06)';}
}
document.addEventListener('click',function(e){
  var wrap=document.querySelector('.header-user-wrap');
  if(wrap&&!wrap.contains(e.target)){
    var d=document.getElementById('userDropdown');
    var b=document.getElementById('userMenuBtn');
    if(d){d.classList.remove('open');}
    if(b){b.style.background='';}
  }
});
</script>
</body>
</html>
