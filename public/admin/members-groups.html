<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Groups — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="breadcrumb">Members › <span>Member Groups</span></div></div>
      <div class="header-right"><div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="if(!document.getElementById('userDropdown').classList.contains('open'))this.style.background=''">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div></div>
    </header>
    <div class="admin-content">
      <div class="page-title"><h1>Member Groups</h1><p>Organize members into targeted groups for content and promotions.</p></div>
      <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:24px">
        <!-- Add Group Form -->
        <div class="form-section">
          <h3>Create New Group</h3>
          <div class="form-group"><label>Group Name</label><input type="text" id="groupName" placeholder="e.g. Premium Buyers"></div>
          <div class="form-group" style="margin-top:12px"><label>Description</label><textarea id="groupDesc" placeholder="What is this group for?" style="min-height:80px"></textarea></div>
          <div class="form-group" style="margin-top:12px"><label>Group Color</label>
            <div style="display:flex;gap:8px;margin-top:4px" id="colorPicker">
              <div class="color-swatch" data-color="#d4af37" style="width:28px;height:28px;background:#d4af37;border-radius:6px;cursor:pointer;border:2px solid white"></div>
              <div class="color-swatch" data-color="#667eea" style="width:28px;height:28px;background:#667eea;border-radius:6px;cursor:pointer"></div>
              <div class="color-swatch" data-color="#11998e" style="width:28px;height:28px;background:#11998e;border-radius:6px;cursor:pointer"></div>
              <div class="color-swatch" data-color="#ee0979" style="width:28px;height:28px;background:#ee0979;border-radius:6px;cursor:pointer"></div>
              <div class="color-swatch" data-color="#4facfe" style="width:28px;height:28px;background:#4facfe;border-radius:6px;cursor:pointer"></div>
              <div class="color-swatch" data-color="#f093fb" style="width:28px;height:28px;background:#f093fb;border-radius:6px;cursor:pointer"></div>
            </div>
          </div>
          <div class="form-group" style="margin-top:12px"><label>Minimum Points (auto-membership)</label><input type="number" id="groupMin" value="0" min="0" style="width:120px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#e2e8f0;font-size:13px;outline:none"></div>
          <div class="form-actions" style="margin-top:16px"><button class="btn-primary" onclick="addGroup()">+ Create Group</button></div>
        </div>
        <!-- Groups List -->
        <div class="form-section">
          <h3>Existing Groups</h3>
          <div id="groupsList">
            <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:24px">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script>
let groups = [];
let selectedColor = '#d4af37';
let editingId = null;

document.querySelectorAll('#colorPicker .color-swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    document.querySelectorAll('#colorPicker .color-swatch').forEach(s=>s.style.border='');
    sw.style.border = '2px solid white';
    selectedColor = sw.dataset.color;
  });
});
// mark first swatch selected by default
(function(){ const f=document.querySelector('#colorPicker .color-swatch'); if(f) f.style.border='2px solid white'; })();

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadGroups(){
  try {
    const data = await apiGet('/api/admin/member-groups');
    if(data && data.ok){ groups = data.groups || []; }
    else { groups = []; }
  } catch(e){ groups = []; }
  renderGroups();
}

function renderGroups(){
  const host = document.getElementById('groupsList');
  if(!groups.length){
    host.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:24px">No groups yet. Create one on the left.</div>';
    return;
  }
  host.innerHTML = groups.map(g=>`
    <div class="group-row" style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:${esc(g.color)}11;border:1px solid ${esc(g.color)}33;border-radius:8px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:12px;height:12px;background:${esc(g.color)};border-radius:50%"></div>
        <div><div style="font-weight:500">${esc(g.name)}</div><div style="font-size:12px;color:var(--text-muted)">${(g.members||0)} members · ${esc(g.description||'')} · min ${g.min_points||0} pts</div></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="openEdit(${g.id})">Edit</button>
        <button class="btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteGroup(${g.id})">Delete</button>
      </div>
    </div>`).join('');
}

async function addGroup(){
  const name = document.getElementById('groupName').value.trim();
  if(!name){ showToast('Please enter a group name','error'); return; }
  const res = await apiSend('/api/admin/member-groups','POST',{
    name,
    description: document.getElementById('groupDesc').value,
    color: selectedColor,
    min_points: parseInt(document.getElementById('groupMin').value)||0
  });
  if(res && res.ok){
    showToast('Group created');
    document.getElementById('groupName').value='';
    document.getElementById('groupDesc').value='';
    loadGroups();
  } else { showToast((res && res.error) || 'Failed to create','error'); }
}

function openEdit(id){
  const g = groups.find(x=>x.id===id);
  if(!g) return;
  editingId = id;
  document.getElementById('groupName').value = g.name;
  document.getElementById('groupDesc').value = g.description || '';
  document.getElementById('groupMin').value = g.min_points || 0;
  selectedColor = g.color || '#d4af37';
  document.querySelectorAll('#colorPicker .color-swatch').forEach(s=>{
    s.style.border = (s.dataset.color === selectedColor) ? '2px solid white' : '';
  });
  showToast('Editing "'+g.name+'" — click Create Group to save');
}
async function deleteGroup(id){
  if(!confirm('Delete this group?')) return;
  const res = await apiSend('/api/admin/member-groups?id='+id,'DELETE');
  if(res && res.ok){ showToast('Group deleted'); loadGroups(); }
  else { showToast((res && res.error) || 'Failed to delete','error'); }
}

document.addEventListener('DOMContentLoaded', loadGroups);
</script>

<style id="user-dropdown-style">
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;}
.user-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.user-dropdown-info{padding:14px 16px;}
.user-dropdown-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-muted);font-size:13px;text-decoration:none;transition:.15s;cursor:pointer;}
.user-dropdown-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0;}
.user-dropdown-logout{color:#f87171!important;}
.user-dropdown-logout:hover{background:rgba(238,9,121,.08)!important;}
</style>
<script>
function toggleUserMenu(){
  var d=document.getElementById('userDropdown');
  var b=document.getElementById('userMenuBtn');
  if(d.classList.contains('open')){d.classList.remove('open');b.style.background='';}
  else{d.classList.add('open');b.style.background='rgba(255,255,255,.06)';}
}
document.addEventListener('click',function(e){
  var wrap=document.querySelector('.header-user-wrap');
  if(wrap&&!wrap.contains(e.target)){
    var d=document.getElementById('userDropdown');
    var b=document.getElementById('userMenuBtn');
    if(d){d.classList.remove('open');}
    if(b){b.style.background='';}
  }
});
</script>
</body>
</html>
