<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reported Posts — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
.report-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px;transition:.2s}
.report-card:hover{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.02)}
.report-card.resolved{opacity:.55;border-left:3px solid #34d399}
.report-card.rejected{opacity:.55;border-left:3px solid #94a3b8}
.report-card.pending{border-left:3px solid #f87171}
.severity-badge{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600}
.sev-high{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.sev-medium{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.sev-low{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.post-preview-box{background:rgba(248,113,113,.05);border:1px solid rgba(248,113,113,.15);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px;color:#cbd5e1;line-height:1.6}
.report-reason-tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;background:rgba(255,255,255,.06);color:#94a3b8;border:1px solid var(--border);margin-right:5px}
.reporter-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.avatar-xs{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f87171,#fb923c);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.action-row{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.stat-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center}
.stat-item .num{font-size:26px;font-weight:700}
.stat-item .lab{font-size:12px;color:var(--text-muted);margin-top:3px}
.tab-row{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab-btn{padding:9px 18px;font-size:13px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s;background:none;border-top:none;border-left:none;border-right:none}
.tab-btn.active{color:#f87171;border-bottom-color:#f87171}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.filter-bar select{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#e2e8f0;font-size:13px;outline:none}
.empty-note{text-align:center;padding:40px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎮</span><div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left"><button class="mobile-toggle" onclick="toggleSidebar()">☰</button><div class="breadcrumb">Forum / <span>Reported Posts</span></div></div>
      <div class="header-right">
        <div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;">
            <div class="user-avatar">A</div><span style="color:var(--text-muted);font-size:13px;">Admin</span><span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info"><div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div><div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div></div>
            <div class="user-dropdown-divider"></div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Account Settings</a>
            <a href="../index.html" target="_blank" class="user-dropdown-item">🌐 View Website</a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item user-dropdown-logout" onclick="adminLogout();return false;">🚪 Sign Out</a>
          </div>
        </div>
      </div>
    </header>
    <div class="admin-content">
      <div class="page-header" style="margin-bottom:20px">
        <div>
          <h1 class="page-title">🚩 Reported Posts</h1>
          <p class="page-subtitle">Review community reports and take moderation action</p>
        </div>
        <div style="display:flex;gap:10px">
          <a href="forum.html" class="btn btn-outline btn-sm">💬 All Posts</a>
        </div>
      </div>

      <div class="stat-summary">
        <div class="stat-item"><div class="num" style="color:#f87171" id="stPending">0</div><div class="lab">Pending</div></div>
        <div class="stat-item"><div class="num" style="color:#34d399" id="stResolved">0</div><div class="lab">Resolved</div></div>
        <div class="stat-item"><div class="num" style="color:#94a3b8" id="stRejected">0</div><div class="lab">Rejected</div></div>
        <div class="stat-item"><div class="num" style="color:var(--gold)" id="stTotal">0</div><div class="lab">Total</div></div>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab(this,'all')" id="tabAll">All (0)</button>
        <button class="tab-btn" onclick="switchTab(this,'pending')" id="tabPending">🔴 Pending (0)</button>
        <button class="tab-btn" onclick="switchTab(this,'resolved')" id="tabResolved">✅ Resolved (0)</button>
        <button class="tab-btn" onclick="switchTab(this,'rejected')" id="tabRejected">🚫 Rejected (0)</button>
      </div>

      <div class="filter-bar">
        <select id="reasonFilter" onchange="filterReports()">
          <option value="">All Reasons</option>
          <option value="spam">Spam</option>
          <option value="harassment">Harassment</option>
          <option value="off_topic">Off-topic</option>
          <option value="inappropriate">Inappropriate</option>
        </select>
      </div>

      <div id="reportList"><div class="empty-note">Loading…</div></div>
    </div>
  </div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center" id="actionModal">
  <div style="background:#12182b;border:1px solid var(--border);border-radius:14px;padding:28px;width:520px;max-width:92vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="margin:0;font-size:17px;color:#e2e8f0">Take Moderation Action</h3>
      <button onclick="closeAction()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer">×</button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Report: <strong id="actionPostTitle" style="color:#e2e8f0"></strong></p>
    <div style="display:grid;gap:10px;margin-bottom:18px">
      <button class="btn btn-outline" style="text-align:left;padding:12px 16px;justify-content:flex-start;gap:12px" onclick="takeAction('resolve')">
        <span style="font-size:20px">✅</span><div><div style="font-weight:600;font-size:13px">Resolve — no further action</div><div style="font-size:12px;color:var(--text-muted)">Mark report handled, keep the content</div></div>
      </button>
      <button class="btn btn-outline" style="text-align:left;padding:12px 16px;justify-content:flex-start;gap:12px;border-color:rgba(52,211,153,.3);color:#34d399" onclick="takeAction('reject')">
        <span style="font-size:20px">🚫</span><div><div style="font-weight:600;font-size:13px">Reject Report</div><div style="font-size:12px;color:var(--text-muted)">Dismiss as invalid</div></div>
      </button>
    </div>
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px">Moderator Note (optional)</label>
      <textarea id="modNote" rows="2" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#e2e8f0;font-size:13px;outline:none;box-sizing:border-box" placeholder="Add an internal note..."></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeAction()">Cancel</button>
      <button class="btn btn-gold" onclick="submitAction()">Confirm</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
let reports = [];
let filtered = [];
let currentId = null;
let currentDecision = 'resolve';

function severityFromReason(reason){
  const r=(reason||'').toLowerCase();
  if(r.includes('harass')||r.includes('spam')) return 'high';
  if(r.includes('inappropriate')||r.includes('copyright')) return 'medium';
  return 'low';
}
function fmtTs(ts){ if(!ts) return '—'; return new Date(ts*1000).toISOString().replace('T',' ').slice(0,16); }

async function loadReports(){
  try{
    const data = await apiGet('/api/admin/forum-reports?status=pending');
    if(data.ok){
      reports = data.reports||[];
      const s=data.stats||{};
      document.getElementById('stPending').textContent=s.pending||0;
      document.getElementById('stResolved').textContent=s.resolved||0;
      document.getElementById('stRejected').textContent=s.rejected||0;
      document.getElementById('stTotal').textContent=s.total||0;
      document.getElementById('tabAll').textContent='All ('+s.total+')';
      document.getElementById('tabPending').textContent='🔴 Pending ('+s.pending+')';
      document.getElementById('tabResolved').textContent='✅ Resolved ('+s.resolved+')';
      document.getElementById('tabRejected').textContent='🚫 Rejected ('+s.rejected+')';
      filterReports();
    } else { showToast('Failed to load reports'); }
  }catch(e){ showToast('Network error'); }
}

function switchTab(el,tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filtered = tab==='all' ? [...reports] : reports.filter(r=>r.status===tab);
  renderReports();
}

function filterReports(){
  const reason=document.getElementById('reasonFilter').value.toLowerCase();
  filtered = reports.filter(r=> !reason || (r.reason||'').toLowerCase().includes(reason));
  renderReports();
}

function renderReports(){
  const list=document.getElementById('reportList');
  if(!filtered.length){list.innerHTML='<div class="empty-note">No reports in this view ✅</div>';return;}
  list.innerHTML=filtered.map(r=>{
    const sev=severityFromReason(r.reason);
    const ctx = r.thread_id ? ('Thread #'+r.thread_id) : (r.reply_id ? ('Reply #'+r.reply_id) : 'General');
    const reporter = r.reporter_name || r.reporter_email || 'Anonymous';
    return `
    <div class="report-card ${r.status}" id="rc${r.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
            <span class="severity-badge sev-${sev}">🚩 ${sev.toUpperCase()} SEVERITY</span>
            <span class="report-reason-tag">${r.reason}</span>
            <span style="font-size:12px;color:var(--text-muted)">${fmtTs(r.created_at)}</span>
          </div>
          <div style="font-size:14px;font-weight:600;color:#e2e8f0;margin-bottom:4px">${r.reason} report</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Context: <span style="color:var(--gold)">${ctx}</span></div>
        </div>
        <div style="text-align:right">
          <span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;
            ${r.status==='pending'?'background:rgba(248,113,113,.1);color:#f87171':''}
            ${r.status==='resolved'?'background:rgba(52,211,153,.1);color:#34d399':''}
            ${r.status==='rejected'?'background:rgba(148,163,184,.1);color:#94a3b8':''}">${r.status.toUpperCase()}</span>
        </div>
      </div>
      <div class="post-preview-box">${(r.detail||'(no detail provided)')}</div>
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">Reported by</div>
        <div class="reporter-row"><div class="avatar-xs">${(reporter.charAt(0)||'?').toUpperCase()}</div><span>${reporter}</span></div>
      </div>
      <div class="action-row">
        <button class="btn btn-sm" style="background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.25)" onclick="openAction(${r.id})">⚡ Take Action</button>
        <button class="btn btn-outline btn-sm" onclick="quickReject(${r.id})">🚫 Reject</button>
      </div>
    </div>`;
  }).join('');
}

function openAction(id){
  const r=reports.find(x=>x.id===id); if(!r) return;
  currentId=id;
  document.getElementById('actionPostTitle').textContent=r.reason+' report';
  document.getElementById('actionModal').style.display='flex';
}
function closeAction(){document.getElementById('actionModal').style.display='none';currentId=null;}
function takeAction(decision){ currentDecision=decision; }

async function submitAction(){
  if(!currentId) return;
  const note=document.getElementById('modNote').value.trim();
  const res=await apiSend('/api/admin/forum-reports?id='+currentId,'PUT',{decision:currentDecision,note});
  closeAction();
  if(res.ok){ showToast('Report '+(currentDecision==='rejected'?'rejected':'resolved')); loadReports(); }
  else { showToast(res.error||'Update failed','error'); }
}
async function quickReject(id){
  const res=await apiSend('/api/admin/forum-reports?id='+id,'PUT',{decision:'rejected'});
  if(res.ok){ showToast('Report rejected'); loadReports(); } else { showToast(res.error||'Update failed','error'); }
}

document.addEventListener('DOMContentLoaded',loadReports);
</script>
</body>
</html>
