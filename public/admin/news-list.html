<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manage News — NexAmuse Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filter-row .field{display:flex;flex-direction:column;gap:6px}
.filter-row label{font-size:12px;color:var(--text-muted)}
.filter-row select,.filter-row input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13px;min-width:160px}
.news-table{width:100%;border-collapse:collapse;background:var(--surface2);border-radius:10px;overflow:hidden}
.news-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:12px 14px;border-bottom:1px solid var(--border)}
.news-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;color:#cbd5e1;vertical-align:top}
.news-table tr:hover{background:rgba(255,255,255,.03)}
.news-title{color:#e2e8f0;font-weight:600;max-width:420px}
.news-meta{font-size:11px;color:var(--text-muted);margin-top:4px}
.st-badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.st-published{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.35)}
.st-pending{background:rgba(201,162,39,.15);color:#f0c040;border:1px solid rgba(201,162,39,.35)}
.row-actions{display:flex;gap:8px}
.btn-mini{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:#e2e8f0;cursor:pointer}
.btn-mini:hover{border-color:var(--accent)}
.btn-mini.danger{color:#ef4444;border-color:rgba(239,68,68,.3)}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-mask.open{display:flex}
.modal-box{background:#0f1424;border:1px solid var(--border);border-radius:14px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-box h3{margin:0 0 16px;color:#e2e8f0;font-size:18px}
.frm{display:flex;flex-direction:column;gap:14px}
.frm label{font-size:12px;color:var(--text-muted)}
.frm input,.frm textarea,.frm select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:13px;width:100%}
.frm textarea{resize:vertical;min-height:90px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🎮</span>
      <div><div class="logo-text">NexAmuse</div><div class="logo-sub">Global Admin</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <div class="breadcrumb">News / <span>Manage News</span></div>
      </div>
      <div class="header-right">
        <div class="header-user-wrap" style="position:relative;">
          <button class="header-user" id="userMenuBtn" onclick="toggleUserMenu()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:.2s;">
            <div class="user-avatar">A</div>
            <span style="color:var(--text-muted);font-size:13px;">Admin</span>
            <span style="color:var(--text-muted);font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-info">
              <div style="font-weight:600;color:#e2e8f0;font-size:13px;">Administrator</div>
              <div style="font-size:11px;color:var(--text-muted);">admin@nexamuse.com</div>
            </div>
            <a href="settings.html" class="user-dropdown-item">⚙️ Settings</a>
            <div class="user-dropdown-item" onclick="adminLogout()" style="cursor:pointer;color:#ef4444">🚪 Sign Out</div>
          </div>
        </div>
      </div>
    </header>

    <div class="admin-content">
      <div class="card">
        <div class="card-header"><h3>🗞️ Manage News</h3></div>
        <div class="card-body">
          <div class="filter-row">
            <div class="field">
              <label>Status</label>
              <select id="fStatus" onchange="loadNews()">
                <option value="">All</option>
                <option value="published">Published</option>
                <option value="pending">Pending</option>
              </select>
            </div>
            <div class="field">
              <label>Category</label>
              <select id="fCat" onchange="loadNews()"><option value="">All</option></select>
            </div>
            <div class="field">
              <label>Search</label>
              <input id="fQ" type="text" placeholder="Title contains…" oninput="loadNews()">
            </div>
            <a href="news-add.html" class="btn btn-gold btn-sm" style="margin-bottom:2px">➕ Add News</a>
          </div>
          <div id="listWrap"><p style="color:var(--text-muted);font-size:13px;">Loading…</p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-mask" id="editMask">
  <div class="modal-box">
    <h3>✏️ Edit News</h3>
    <div class="frm">
      <label>Title</label><input id="eTitle" type="text">
      <label>Summary</label><textarea id="eSummary"></textarea>
      <label>Source URL (leave empty for manual)</label><input id="eUrl" type="text">
      <label>Source Name</label><input id="eSource" type="text">
      <label>Category</label><select id="eCat"></select>
      <label>Status</label>
      <select id="eStatus"><option value="published">Published</option><option value="pending">Pending</option></select>
      <div class="modal-foot">
        <button class="btn btn-outline btn-sm" onclick="closeEdit()">Cancel</button>
        <button class="btn btn-gold btn-sm" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
let CATS = [];
let editId = null;

async function loadCats() {
  try {
    const d = await apiGet('/api/news-categories');
    CATS = d.categories || [];
    const f = document.getElementById('fCat');
    const e = document.getElementById('eCat');
    CATS.forEach(c => {
      f.insertAdjacentHTML('beforeend', `<option value="${c.code}">${c.name}</option>`);
      e.insertAdjacentHTML('beforeend', `<option value="${c.code}">${c.name}</option>`);
    });
  } catch (e) {}
}

async function loadNews() {
  const wrap = document.getElementById('listWrap');
  wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Loading…</p>';
  const status = document.getElementById('fStatus').value;
  const cat = document.getElementById('fCat').value;
  const q = document.getElementById('fQ').value.trim().toLowerCase();
  let data;
  try {
    data = await apiGet('/api/news?manage=1&limit=200');
  } catch (e) {
    wrap.innerHTML = '<p style="color:#ef4444">Failed to load news.</p>';
    return;
  }
  let rows = data.news || [];
  if (status) rows = rows.filter(r => r.status === status);
  if (cat) rows = rows.filter(r => r.category === cat);
  if (q) rows = rows.filter(r => (r.title || '').toLowerCase().includes(q));

  if (!rows.length) {
    wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No news found.</p>';
    return;
  }
  const catName = (code) => (CATS.find(c => c.code === code) || {}).name || code || '—';
  wrap.innerHTML = `<table class="news-table"><thead><tr>
    <th style="width:46%">Title</th><th>Source</th><th>Category</th><th>Status</th><th>Date</th><th></th>
  </tr></thead><tbody>${rows.map(r => `
    <tr>
      <td><div class="news-title">${escapeHtml(r.title)}</div>
          <div class="news-meta">${r.url && r.url !== '#' ? '🔗 linked' : '✍️ manual'}</div></td>
      <td>${escapeHtml(r.source || '—')}</td>
      <td>${catName(r.category)}</td>
      <td><span class="st-badge ${r.status === 'published' ? 'st-published' : 'st-pending'}">${r.status}</span></td>
      <td>${r.published_at ? new Date(r.published_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'}) : '—'}</td>
      <td><div class="row-actions">
        <button class="btn-mini" onclick="openEdit(${r.id})">Edit</button>
        <button class="btn-mini danger" onclick="delNews(${r.id})">Delete</button>
      </div></td>
    </tr>`).join('')}</tbody></table>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openEdit(id) {
  const row = (window.__rows || []).find(r => r.id === id);
  apiGet('/api/news?manage=1&limit=200').then(d => {
    const r = (d.news || []).find(x => x.id === id);
    if (!r) return;
    editId = id;
    document.getElementById('eTitle').value = r.title || '';
    document.getElementById('eSummary').value = r.summary || '';
    document.getElementById('eUrl').value = (r.url && r.url !== '#') ? r.url : '';
    document.getElementById('eSource').value = r.source || '';
    document.getElementById('eCat').value = r.category || 'industry';
    document.getElementById('eStatus').value = r.status || 'published';
    document.getElementById('editMask').classList.add('open');
  });
}

function closeEdit() {
  document.getElementById('editMask').classList.remove('open');
  editId = null;
}

async function saveEdit() {
  if (!editId) return;
  const payload = {
    title: document.getElementById('eTitle').value.trim(),
    summary: document.getElementById('eSummary').value.trim(),
    url: document.getElementById('eUrl').value.trim(),
    source: document.getElementById('eSource').value.trim(),
    category: document.getElementById('eCat').value,
    status: document.getElementById('eStatus').value
  };
  try {
    await apiSend('/api/news/' + editId, 'PUT', payload);
    showToast('News updated.', 'success');
    closeEdit();
    loadNews();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function delNews(id) {
  if (!confirm('Delete this news item? This cannot be undone.')) return;
  try {
    await apiSend('/api/news/' + id, 'DELETE');
    showToast('News deleted.', 'success');
    loadNews();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initPage('news-list');
  loadCats();
  loadNews();
});
</script>
</body>
</html>
