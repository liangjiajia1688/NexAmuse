<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>二手设备市场 — NexAmuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <style>
    .market{max-width:1200px;margin:40px auto;padding:0 20px;}
    .market h1{color:#fff;font-size:2.2rem;}
    .market .lead{color:var(--text-secondary);margin:8px 0 24px;}
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px;}
    .chip{padding:8px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;font-size:.88rem;}
    .chip.active{background:var(--accent-gradient);color:#1a1e2e;font-weight:600;border:none;}
    .search-inline{flex:1;min-width:200px;}
    .search-inline input{width:100%;background:#1a2035;border:1px solid var(--border);border-radius:20px;padding:9px 16px;color:#e8eaf0;outline:none;}
    .search-inline input:focus{border-color:var(--accent);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
    .pcard{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition);cursor:pointer;}
    .pcard:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-hover);}
    .pcard .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#1c2540,#0d1530);display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--accent);overflow:hidden;}
    .pcard .thumb img{width:100%;height:100%;object-fit:cover;}
    .pcard .body{padding:16px;}
    .pcard .ttl{color:#fff;font-weight:600;font-size:1rem;margin-bottom:6px;}
    .pcard .meta{color:var(--text-secondary);font-size:.82rem;display:flex;justify-content:space-between;}
    .pcard .price{color:var(--accent);font-weight:700;font-size:1.05rem;}
    .tag{display:inline-block;background:var(--tag-bg);color:var(--accent);padding:2px 10px;border-radius:12px;font-size:.75rem;margin-right:6px;}
    .empty{color:var(--text-secondary);text-align:center;padding:60px 0;grid-column:1/-1;}
  </style>
</head>
<body>
  <div id="na-header"></div>

  <div class="market">
    <h1>二手设备市场</h1>
    <p class="lead">游戏厅、游乐场转型或结业？在这里发布你的二手设备，让全国的买家看到。</p>

    <div class="filters">
      <div class="chip active" data-cat="">全部</div>
      <div class="chip" data-cat="arcade">游戏机 / 街机</div>
      <div class="chip" data-cat="amusement">游乐设备</div>
      <div class="chip" data-cat="anime">动漫周边</div>
      <div class="chip" data-cat="other">其他</div>
      <div class="search-inline"><input id="search" placeholder="搜索设备名称…"/></div>
      <a href="dashboard.html" class="btn-primary" style="padding:9px 20px;">+ 发布二手</a>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div id="na-footer"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const grid = $('grid');
    const params = new URLSearchParams(location.search);
    let curCat = params.get('cat') || '';

    function highlight() {
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.dataset.cat === curCat);
      });
    }

    function card(p) {
      const img = (p.images && p.images.length) ? `<img src="${p.images[0]}" alt=""/>` : '🎰';
      const price = p.price ? '¥' + Number(p.price).toLocaleString() : '面议';
      return `<div class="pcard" onclick="location.href='product.html?id=${p.id}'">
        <div class="thumb">${img}</div>
        <div class="body">
          <div class="ttl">${window.Auth.escapeHtml(p.title)}</div>
          <div style="margin:6px 0;"><span class="tag">${p.cond||'二手'}</span><span class="tag">${p.category||''}</span></div>
          <div class="meta"><span class="price">${price}</span><span>${window.Auth.escapeHtml(p.location||'')}</span></div>
        </div></div>`;
    }

    async function load() {
      grid.innerHTML = '<div class="empty">加载中…</div>';
      const q = curCat ? ('?cat=' + encodeURIComponent(curCat)) : '';
      try {
        const r = await window.Api.products(q);
        grid.innerHTML = (r.products && r.products.length)
          ? r.products.map(card).join('')
          : '<div class="empty">暂无设备，快来发布第一条吧！</div>';
      } catch (e) { grid.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
    }

    document.querySelectorAll('.chip').forEach(c => {
      c.onclick = () => { curCat = c.dataset.cat; highlight(); load(); };
    });

    let timer;
    $('search').addEventListener('input', (e) => {
      clearTimeout(timer);
      const v = e.target.value.trim();
      timer = setTimeout(async () => {
        try {
          const r = await window.Api.products(v ? ('?q=' + encodeURIComponent(v)) : '');
          grid.innerHTML = (r.products && r.products.length) ? r.products.map(card).join('') : '<div class="empty">无匹配结果</div>';
        } catch (e) { /* ignore */ }
      }, 350);
    });

    highlight();
    load();
  </script>
</body>
</html>
