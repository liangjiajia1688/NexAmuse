<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>论坛 — NexAmuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <style>
    .fwrap{max-width:900px;margin:40px auto;padding:0 20px;}
    .fwrap h1{color:#fff;font-size:2.2rem;}
    .fwrap .lead{color:var(--text-secondary);margin:8px 0 20px;}
    .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
    .chip{padding:7px 15px;border-radius:18px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;font-size:.85rem;}
    .chip.active{background:var(--accent-gradient);color:#1a1e2e;font-weight:600;border:none;}
    .post-box{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;cursor:pointer;transition:var(--transition);}
    .post-box:hover{border-color:var(--accent);}
    .post-box .ttl{color:#fff;font-weight:700;font-size:1.15rem;}
    .post-box .ex{color:var(--text-secondary);margin-top:8px;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .post-box .meta{color:var(--text-secondary);font-size:.8rem;margin-top:10px;}
    .post-box .meta .tag{background:var(--tag-bg);color:var(--accent);padding:2px 9px;border-radius:12px;margin-right:8px;}
    .composer{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:22px;display:none;}
    .composer.active{display:block;}
    .composer h3{color:#fff;margin-bottom:12px;}
    .empty{color:var(--text-secondary);text-align:center;padding:50px 0;}
  </style>
</head>
<body>
  <div id="na-header"></div>
  <div class="fwrap">
    <h1>论坛</h1>
    <p class="lead">行业交流、转让信息、经验分享 —— 所有注册用户均可发帖。</p>

    <button class="btn-primary" id="toggleComposer" style="padding:10px 22px;margin-bottom:18px;">+ 我要发帖</button>

    <div class="composer" id="composer">
      <h3>发布新帖</h3>
      <div class="form-group"><label>标题</label><input id="t_title" placeholder="一句话说清主题"/></div>
      <div class="form-group"><label>分类</label>
        <select id="t_cat"><option value="综合">综合</option><option value="交易">交易</option><option value="求助">求助</option><option value="晒图">晒图</option></select>
      </div>
      <div class="form-group"><label>内容</label><textarea id="t_content" placeholder="详细说说…"></textarea></div>
      <button class="btn-primary" id="t_submit" style="padding:10px 22px;">发布</button>
      <span id="t_msg" style="margin-left:12px;font-size:.85rem;"></span>
    </div>

    <div class="filters">
      <div class="chip active" data-cat="">全部</div>
      <div class="chip" data-cat="综合">综合</div>
      <div class="chip" data-cat="交易">交易</div>
      <div class="chip" data-cat="求助">求助</div>
      <div class="chip" data-cat="晒图">晒图</div>
    </div>

    <div id="list"></div>
  </div>
  <div id="na-footer"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const list = $('list');
    let curCat = '';

    $('toggleComposer').onclick = () => $('composer').classList.toggle('active');

    $('t_submit').onclick = async () => {
      if (!window.Auth.isLogin()) { $('t_msg').textContent = '请先登录'; $('t_msg').style.color = '#ff6b6b'; return; }
      const title = $('t_title').value.trim(), content = $('t_content').value.trim();
      if (!title || !content) { $('t_msg').textContent = '标题和内容必填'; $('t_msg').style.color = '#ff6b6b'; return; }
      try {
        const r = await window.Api.createPost({ title, content, category: $('t_cat').value });
        if (r.ok) { location.href = 'post.html?id=' + r.id; }
      } catch (e) { $('t_msg').textContent = e.message; $('t_msg').style.color = '#ff6b6b'; }
    };

    document.querySelectorAll('.chip').forEach(c => {
      c.onclick = () => { document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); curCat = c.dataset.cat; load(); };
    });

    async function load() {
      list.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const r = await window.Api.forum(curCat ? ('?category=' + encodeURIComponent(curCat)) : '');
        list.innerHTML = (r.posts && r.posts.length) ? r.posts.map(p => `
          <div class="post-box" onclick="location.href='post.html?id=${p.id}'">
            <div class="ttl">${window.Auth.escapeHtml(p.title)}</div>
            <div class="ex">${window.Auth.escapeHtml(p.content)}</div>
            <div class="meta"><span class="tag">${window.Auth.escapeHtml(p.category||'综合')}</span>👤 ${window.Auth.escapeHtml(p.author||'匿名')} · 🕒 ${new Date(p.created_at*1000).toLocaleDateString()}</div>
          </div>`).join('')
          : '<div class="empty">还没有帖子，来发第一帖吧！</div>';
      } catch (e) { list.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
    }
    load();
  </script>
</body>
</html>
