<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>帖子 — NexAmuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <style>
    .pwrap{max-width:800px;margin:40px auto;padding:0 20px;}
    .back{color:var(--text-secondary);text-decoration:none;font-size:.85rem;}
    .ptitle{color:#fff;font-size:2rem;margin:14px 0 8px;}
    .pmeta{color:var(--text-secondary);font-size:.85rem;margin-bottom:20px;}
    .pmeta .tag{background:var(--tag-bg);color:var(--accent);padding:2px 10px;border-radius:12px;margin-right:8px;}
    .pcontent{color:var(--text-primary);line-height:1.9;white-space:pre-wrap;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
    .replies{margin-top:34px;}
    .replies h2{color:#fff;font-size:1.4rem;margin-bottom:16px;}
    .reply{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
    .reply .au{color:var(--accent);font-weight:600;font-size:.9rem;}
    .reply .rc{color:var(--text-secondary);margin-top:6px;line-height:1.7;white-space:pre-wrap;}
    .reply-form{margin-top:24px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
    .reply-form h3{color:#fff;margin-bottom:12px;}
    .loading{color:var(--text-secondary);text-align:center;padding:80px 0;}
    .hint{color:var(--text-secondary);font-size:.9rem;margin-top:8px;}
  </style>
</head>
<body>
  <div id="na-header"></div>
  <div id="content"><div class="loading">加载中…</div></div>
  <div id="na-footer"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const id = new URLSearchParams(location.search).get('id');

    (async () => {
      if (!id) { $('content').innerHTML = '<div class="loading">缺少帖子 ID</div>'; return; }
      try {
        const r = await window.Api.post(id);
        const p = r.post, a = r.author || {};
        const replies = (r.replies || []).map(rp => `
          <div class="reply"><div class="au">${window.Auth.escapeHtml(rp.author||'匿名')} · 🕒 ${new Date(rp.created_at*1000).toLocaleString()}</div>
          <div class="rc">${window.Auth.escapeHtml(rp.content)}</div></div>`).join('') || '<p class="hint">还没有回复，来抢沙发～</p>';

        $('content').innerHTML = `
          <div class="pwrap">
            <a href="forum.html" class="back">← 返回论坛</a>
            <h1 class="ptitle">${window.Auth.escapeHtml(p.title)}</h1>
            <div class="pmeta"><span class="tag">${window.Auth.escapeHtml(p.category||'综合')}</span>👤 ${window.Auth.escapeHtml(a.username||'匿名')} · 🕒 ${new Date(p.created_at*1000).toLocaleString()}</div>
            <div class="pcontent">${window.Auth.escapeHtml(p.content)}</div>
            <div class="replies"><h2>回复（${r.replies?r.replies.length:0}）</h2>${replies}</div>
            <div class="reply-form">
              <h3>发表回复</h3>
              <div class="form-group"><textarea id="r_content" placeholder="写下你的回复…"></textarea></div>
              <button class="btn-primary" id="r_submit" style="padding:10px 22px;">回复</button>
              <span id="r_msg" style="margin-left:12px;font-size:.85rem;color:#ff6b6b;"></span>
            </div>
          </div>`;
        document.title = p.title + ' — NexAmuse';

        $('r_submit').onclick = async () => {
          if (!window.Auth.isLogin()) { $('r_msg').textContent = '请先登录后再回复'; return; }
          const c = $('r_content').value.trim(); if (!c) { $('r_msg').textContent = '回复内容不能为空'; return; }
          try { const rr = await window.Api.reply(id, { content: c }); if (rr.ok) location.reload(); }
          catch (e) { $('r_msg').textContent = e.message; }
        };
      } catch (e) { $('content').innerHTML = '<div class="loading">加载失败：' + e.message + '</div>'; }
    })();
  </script>
</body>
</html>
