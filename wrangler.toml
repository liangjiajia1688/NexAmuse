name = "nexamuse-platform"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 数据库绑定（部署后在 Cloudflare 控制台「Pages 项目 → 设置 → 函数 → D1 数据库」绑定；
# 绑定变量名必须叫 DB，本地 dev 时 wrangler 会按此绑定名注入）
[[d1_databases]]
binding = "DB"
database_name = "nexamuse-db"
database_id = "96d149d9-ab0f-4709-b7c6-a53173bdcd43"
migrations_dir = "src/migrations"
